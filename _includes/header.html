{%- comment -%}
  Include vars:
  scrolly_nav
  blog_posts
{%- endcomment -%}

<!-- Header -->
<div class="site-sidebar">
  <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-controls="header" aria-expanded="true" aria-label="Hide menu" title="Hide menu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="3" y="4" width="18" height="16" rx="3" />
      <path d="M9 4v16" />
      <path class="sidebar-toggle__chevron" d="m13 9 3 3-3 3" />
    </svg>
  </button>
  <div id="header">
    <p class="sidebar-caption" aria-hidden="true">Navigation</p>
    <div class="top">
      {%- include logo.html -%}
      {%- include nav.html section_items=include.scrolly_nav blog_posts=include.blog_posts -%}
      {%- include theme_toggle.html -%}
    </div>
    <div class="bottom">
      {%- include social_icons.html -%}
    </div>
  </div>
</div>
